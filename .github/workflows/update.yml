name: Update AMP

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: update-amp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve the latest signed release
        id: release
        run: |
          set -euo pipefail

          resolver=$(
            nix build .#packages.x86_64-linux.ampinstmgr.releaseResolver \
              --no-link \
              --print-out-paths
          )
          "$resolver" > "$RUNNER_TEMP/release"

          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]

          cat "$RUNNER_TEMP/release" >> "$GITHUB_OUTPUT"
          echo "asset=ampinstmgr-$version.x86_64.deb" >> "$GITHUB_OUTPUT"

      - name: Update package
        id: update
        run: |
          set -euo pipefail

          nix run nixpkgs#nix-update -- \
            --flake \
            --use-update-script \
            ampinstmgr

          if test -L result && [[ "$(readlink result)" == /nix/store/* ]]; then
            rm result
          else
            test ! -e result
          fi

          status=$(git status --porcelain=v1 --untracked-files=all)
          if test -z "$status"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$status" = " M package.nix"
          if git diff --unified=0 -- package.nix |
            grep -E '^[+-]' |
            grep -Ev '^(\+\+\+|---|[+-][[:space:]]+(version|hash|srcFormat)[[:space:]]*=)'; then
            echo "nix-update changed more than version, hash and format" >&2
            exit 1
          fi

          nix fmt
          test "$(git status --porcelain=v1 --untracked-files=all)" = " M package.nix"
          if git diff --unified=0 -- package.nix |
            grep -E '^[+-]' |
            grep -Ev '^(\+\+\+|---|[+-][[:space:]]+(version|hash|srcFormat)[[:space:]]*=)'; then
            echo "formatting changed more than version, hash and format" >&2
            exit 1
          fi

          # Refresh nixpkgs alongside each AMP release so the lock used for CI
          # keeps pace with upstream releases without separate update PRs.
          cp flake.lock "$RUNNER_TEMP/flake.lock.orig"
          old_rev=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          nix flake update nixpkgs
          new_rev=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)

          if jq -e \
            --slurpfile old "$RUNNER_TEMP/flake.lock.orig" \
            'del(.nodes.nixpkgs.locked) != ($old[0] | del(.nodes.nixpkgs.locked))' \
            flake.lock >/dev/null; then
            echo "flake update changed more than the nixpkgs lock" >&2
            exit 1
          fi

          status=$(git status --porcelain=v1 --untracked-files=all)
          if test "$old_rev" = "$new_rev"; then
            test "$status" = " M package.nix"
            nixpkgs="nixpkgs is unchanged at \`${new_rev:0:12}\`."
          else
            test "$status" = "$(printf ' M flake.lock\n M package.nix')"
            nixpkgs="Updates nixpkgs from \`${old_rev:0:12}\` to \`${new_rev:0:12}\`."
          fi

          echo "nixpkgs=$nixpkgs" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify and mirror the .deb
        id: mirror
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail

          test "$(
            sed -n 's/^[[:space:]]*version = "\([^"]*\)";$/\1/p' package.nix
          )" = "$VERSION"
          grep -Fxq '  srcFormat = "deb";' package.nix
          expected=$(
            sed -n 's/^[[:space:]]*hash = "\(sha256-[^"]*\)";$/\1/p' package.nix
          )
          test -n "$expected"

          # The SHA256 comes from the Packages index the resolver verified
          # against CubeCoders' signed InRelease.
          mkdir "$RUNNER_TEMP/upstream"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/upstream/$ASSET"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/upstream/$ASSET" |
            sha256sum --check --strict
          test "$(nix hash file "$RUNNER_TEMP/upstream/$ASSET")" = "$expected"

          tag="upstream-ampinstmgr-$VERSION"
          mkdir "$RUNNER_TEMP/existing"
          publish=false

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" \
              --pattern "$ASSET" \
              --dir "$RUNNER_TEMP/existing"
            cmp \
              "$RUNNER_TEMP/upstream/$ASSET" \
              "$RUNNER_TEMP/existing/$ASSET"
            if test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true; then
              publish=true
            fi
          else
            gh release create "$tag" "$RUNNER_TEMP/upstream/$ASSET#$ASSET" \
              --draft \
              --target "$(git rev-parse HEAD)" \
              --title "AMP Instance Manager $VERSION" \
              --notes "Unmodified CubeCoders AMP Instance Manager amd64 .deb, verified against the signed CubeCoders apt repository."
            gh release download "$tag" \
              --pattern "$ASSET" \
              --dir "$RUNNER_TEMP/existing"
            cmp \
              "$RUNNER_TEMP/upstream/$ASSET" \
              "$RUNNER_TEMP/existing/$ASSET"
            publish=true
          fi

          if test "$publish" = true; then
            gh release edit "$tag" --draft=false
          fi

      - name: Test candidate
        id: checks
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: nix flake check --print-build-logs

      - name: Create pull request
        if: >-
          always() &&
          steps.update.outputs.changed == 'true' &&
          steps.mirror.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix-update/ampinstmgr
          delete-branch: true
          commit-message: "chore(package): update ampinstmgr"
          title: "chore(package): update ampinstmgr"
          body: |
            Updates AMP Instance Manager to `${{ steps.release.outputs.version }}`.

            The upstream .deb matched the SHA256 in CubeCoders' signed apt
            repository index (key `50ED69D7E73CBCF4FB97910C33FB60CD1A773489`)
            and was mirrored unchanged as a GitHub Release asset.

            ${{ steps.update.outputs.nixpkgs }}
          labels: dependencies

      - name: Require successful checks
        if: always() && steps.update.outputs.changed == 'true'
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: test "$CHECKS_OUTCOME" = success
